<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Upload employees · Enterprise Knowledge Agent</title>
    <link rel="stylesheet" href="/ui/styles.css">
  </head>
  <body data-page="operation" data-collection="employees" data-operation="upload">
    <header class="topbar">
      <a class="brand" href="/ui/"><span class="brand-mark">✦</span>Enterprise Knowledge Agent</a>
      <nav class="nav"><a href="/ui/policies-upload.html">Policies</a><a class="active" href="/ui/employees-upload.html">Employees</a><a href="/docs">API docs</a></nav>
    </header>
    <main class="page">
      <div class="breadcrumbs"><a href="/ui/">Home</a> / Employees / Upload</div>
      <div class="eyebrow">Employees</div>
      <h1>Ingest employee data</h1>
      <p class="lead">Upload an Excel spreadsheet to write employee records and persistent vector embeddings to Neo4j.</p>
      <section class="panel">
        <h2>Upload spreadsheet</h2>
        <form id="operation-form"><label for="file">Excel file</label><input id="file" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" required><button type="submit">Upload and ingest</button></form>
        <div id="result" class="result"></div>
        <section class="ingested-files" aria-labelledby="employee-uploads-title">
          <div class="ingested-files-heading"><h3 id="employee-uploads-title">Uploaded employee files</h3><span data-upload-count></span></div>
          <p class="ingested-files-empty" data-upload-empty>No employee spreadsheets uploaded yet.</p>
          <ul class="ingested-files-list" data-upload-list></ul>
        </section>
      </section>
    </main>
    <script src="/ui/app.js"></script>
  </body>
</html>
