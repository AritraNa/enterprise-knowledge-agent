name: enterprise-knowledge-agent

services:
  api:
    build:
      context: .
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      OLLAMA_BASE_URL: http://ollama:11434/v1
      OLLAMA_EMBED_BASE_URL: http://ollama:11434/v1
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-ollama}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      DOCUMENT_INGESTION_MODEL: ${DOCUMENT_INGESTION_MODEL:-llama3.2}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-5}
      RAG_MIN_SIMILARITY_SCORE: ${RAG_MIN_SIMILARITY_SCORE:-0.4}
      RAG_MIN_EMPLOYEE_SIMILARITY_SCORE: ${RAG_MIN_EMPLOYEE_SIMILARITY_SCORE:-0.4}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
      HR_API_KEY: ${HR_API_KEY:-}
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  neo4j:
    image: neo4j:5-community
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u \"$${NEO4J_AUTH%%/*}\" -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  ollama:
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Run once after `docker compose up -d` to download the configured models.
  # It is profile-gated so normal restarts do not wait for model downloads.
  ollama-init:
    image: ollama/ollama:latest
    profiles: ["setup"]
    environment:
      OLLAMA_HOST: ollama:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      DOCUMENT_INGESTION_MODEL: ${DOCUMENT_INGESTION_MODEL:-llama3.2}
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      ollama pull "$$EMBEDDING_MODEL" &&
      ollama pull "$$DOCUMENT_INGESTION_MODEL"
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  neo4j_data:
  neo4j_logs:
  ollama_data:
  uploads:
